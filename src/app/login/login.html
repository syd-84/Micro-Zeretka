<div class="wrapper">
  <div class="head">
    <h3>Вхід</h3>
    <svg (click)="router.navigate([''])">
      <use href="icons.svg#icon-cross" />
    </svg>
  </div>

  <hr>

  <div>
    <p>Пароль</p>
    <input type="password" [formControl]="passwordControl" (keydown)="onKeyDown($event)">
    <app-button (click)="enter()" [disabled]=passwordControl.valid?false:true> Увійти </app-button>
  </div>
</div>
