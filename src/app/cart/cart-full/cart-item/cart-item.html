<div class="cart-item-wrapper">
  <div class="image">
    <img [src]="data()?.product?.imgSrc" alt="image">
  </div>

  <div class="data">
    <p>
      {{data()?.product?.name}}
    </p>
    <p>
      Продавець: Micro-Zeretka
    </p>
  </div>

  <div class="quantity">
    <div (click)="decrement()" [class.hiddenMinus]="quantity() === 1">
      <svg>
        <use href="icons.svg#icon-minus" />
      </svg>
    </div>
    <div>{{quantity()}}</div>
    <div (click)="increment()">
      <svg>
        <use href="icons.svg#icon-plus" />
      </svg>
    </div>
  </div>

  <div class="price">
    {{data()?.product!.price | currencyPipe}}
  </div>

  <div class="subMenu">
    <svg>
      <use href="icons.svg#icon-vertical-dots" />
    </svg>
  </div>
</div>

<button (click)="onClick()">click</button>
