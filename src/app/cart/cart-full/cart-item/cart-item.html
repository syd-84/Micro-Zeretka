<div class="cart-item-wrapper">
  <a [routerLink]="['/product',data()?.product?.id]">
    <div class="image">
      <img [src]="data()?.product?.imgSrc" alt="image">
    </div>

    <div class="data">
      <p>
        {{data()?.product?.name}}
      </p>
      <p>
        Продавець: Micro-Zeretka
      </p>
    </div>
  </a>


  <div class="quantity">
    <div (click)="decrement()" [class.hiddenMinus]="quantity() === 1">
      <svg>
        <use href="icons.svg#icon-minus" />
      </svg>
    </div>
    <div>{{quantity()}}</div>
    <div (click)="increment()">
      <svg>
        <use href="icons.svg#icon-plus" />
      </svg>
    </div>
  </div>

  <div class="price">
    {{totalPrice() | currencyPipe}}
  </div>

  <div class="subMenu"
    (click)="subSubMenu.style.display='flex'; backdrop.style.display='block'; $event.stopPropagation()">
    <svg>
      <use href="icons.svg#icon-vertical-dots" />
    </svg>

    <div>
      <div class="subSubMenu" #subSubMenu
        (click)="goodsService.deleteCartGoodsByProductId(data()!.product.id); subSubMenu.style.display='none'; backdrop.style.display='none'; $event.stopPropagation()">
        <svg>
          <use href="icons.svg#icon-trash" />
        </svg>
        <span>Видалити</span>
      </div>
    </div>
  </div>
</div>

<div class="backdrop" #backdrop (click)="subSubMenu.style.display='none'; backdrop.style.display='none'"></div>
