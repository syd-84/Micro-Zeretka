<div class="search_block">
  <input type="text" [formControl]="inputControl" placeholder="Я шукаю..." (input)="onInput()"
    (keydown)="keyEnter($event)">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
    class="{{inputControl.valid?'':'hidden'}}" (click)="inputControl.reset()">
    <path d="M18 6L6 18M18 18L6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <app-button [style.width.px]="100" (click)="goToSearch()">Знайти</app-button>
</div>

<div class="search_list" [class.hidden]="hideSearchList">
  <div>
    @for (item of searchedGoods(); track $index) {
    <app-search-item [data]="item" (click)="onItemClick()"></app-search-item>
    }
  </div>
  <div class="tint" (click)="onBgClick()"></div>
</div>
