<header class="rozetka-header">
  <div class="header-container">
    <div style="display: flex;">
      <button class="burger-btn" (click)="toggleMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="logo">
        <a [routerLink]="''">
          <span class="logo-icon">
            <svg>
              <use href="icons.svg#logo"></use>
            </svg>
          </span>
          <span class="logo-text">Micro-ZERETKA</span>
        </a>
      </div>
    </div>

    <div class="search-wrapper">
      <app-search></app-search>
    </div>

    <div class="header-actions">
      <app-exchange></app-exchange>
      <button class="action-icon" (click)="goToLogin()">👤</button>
      <button class="action-icon">⚖️</button>
      <button class="action-icon cart" (click)="cartModal.open()">
        🛒
        <div [class.hidden]="numberOfPurchases() === 0">
          {{ numberOfPurchases() }}
        </div>
      </button>
    </div>
  </div>
</header>

@if (cartModal.isOpen()) {
<app-cart></app-cart>
}

<div class="sidebar-backdrop" *ngIf="isMenuOpen" (click)="toggleMenu()"></div>

<div class="sidebar" [class.open]="isMenuOpen">
  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-icon">
        <svg>
          <use href="icons.svg#logo"></use>
        </svg>
      </span>
      <span class="logo-text">ZERETKA</span>
    </div>
    <button class="close-btn" (click)="toggleMenu()">✕</button>
  </div>

  <div class="sidebar-content">
    <button routerLink="/" class="sidebar-catalog-btn" (click)="toggleMenu()">
      <svg>
        <use href="icons.svg#logo"></use>
      </svg>
      Каталог товарів
    </button>

    <ul class="menu-list">
      <li (click)="cartModal.open()">🛒 Кошик</li>
      <li class="not-active">⚖️ Списки порівнянь</li>
      <li class="not-active">📍 Київ</li>
      <li class="not-active">📞 Чат з ZERETKA</li>
      <li class="not-active">🏢 Магазини Zeretka</li>
    </ul>

    <hr />

    <ul class="menu-sublist">
      <li class="not-active">Інформація про компанію</li>
      <li class="not-active">Про нас</li>
      <li class="not-active">Умови використання сайту</li>
      <li class="not-active">Контакти</li>
    </ul>
  </div>
</div>
