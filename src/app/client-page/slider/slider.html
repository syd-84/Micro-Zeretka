<div class="slider" #slider>

    <h2 class="title">{{title}}</h2>

    <div class="slider-body" #slider>



        <div class="cards" [class.no-animation]="isResizing" [style.transform]="`translate(-${translateX()}px)`"
            (window:resize)="onResize($event)">

            @for(product of products(); track product.id){

            <app-product-card [product]="product" style.width.%="{{100/visibleCount}}">
            </app-product-card>

            }

        </div>

        <button class="arrow left" (click)="prev()" [disabled]="startIndex()===0">
            ❮
        </button>

        <button class="arrow right" (click)="next()" [disabled]="startIndex()>=maxSlides">
            ❯
        </button>

    </div>

</div>
