<div class="slider">

    <button class="left" (click)="previous()">
        ❮
    </button>

    <div class="viewport">

        <div
            class="track"
            [style.transform]="'translateX(-' + offset() + 'px)'">

            @for(product of products(); track product.id){

                <app-product-card
                    [product]="product">
                </app-product-card>

            }

        </div>

    </div>

    <button class="right" (click)="next()">
        ❯
    </button>

</div>
