<div class="client-page">

    <app-category (selectedCategory)="changeCategory($event)">
    </app-category>

    <div class="content">

        @if(selectedCategory === 'Усі'){

        <app-slider title="{{'Новинки'}}" [products]="newestProducts()">
        </app-slider>

        }

        @else {

        <app-slider title="{{nameCategory}}" [products]="filteredProducts()"></app-slider>

        }

    </div>

</div>

<div class="allProducts">
    <app-slider title="{{'Усі товари'}}" [products]="oldestProducts()"></app-slider>
</div>
