<div class="client-page">

    <app-category (selectedCategory)="changeCategory($event)">
    </app-category>

    <div class="content">

        @if(selectedCategory === 'Усі'){

        <app-slider title="Новинки" [products]="newestProducts">
        </app-slider>

        <app-slider title="Усі товари" [products]="oldestProducts">
        </app-slider>

        }

        @else {

        <div class="products-grid">

            @for(product of filteredProducts; track product.id){

            <app-product-card [product]="product">
            </app-product-card>

            }

        </div>

        }

    </div>

</div>
