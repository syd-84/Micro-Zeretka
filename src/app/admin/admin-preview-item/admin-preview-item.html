<div class="inline">
  <div>
    <img [src]="data()?.imgSrc" alt="">
  </div>
  <div>
    <a [routerLink]="['../product/', data()?.id]"> {{data()?.name}} </a>
  </div>
</div>
<div class="inline">
  <svg (click)="onClick()">
    <use href="icons.svg#icon-trash" />
  </svg>
</div>

<div [className]="hidden===true?'hidden': 'specification'">
  <div>
    Ви справді хочете видалити
    <br>
    {{data()?.name}}
    <div>
      <app-button (click)="delElement(data()?.id)">Так</app-button>
      <app-button (click)="onClick()">Ні</app-button>
    </div>
  </div>
</div>
